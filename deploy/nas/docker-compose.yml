# Production deployment for ONE tenant of App Venditore, on the self-hosted
# NAS, exposed via Cloudflare Tunnel at pergolando.rdsign-app.it. A second
# tenant is a second copy of this whole stack (different project name,
# different bundle, different subdomain) — not a flag on this one.
#
# Expected layout in this folder (see README.md for how to get each piece):
#   docker-compose.yml       (this file)
#   backend.env              (filled in from backend.env.example)
#   bundle/                  (a bundle folder exported by Studio: manifest.json,
#                              catalog/, branding/)
#   pergolando-backend/      (git clone of the backend repo)
#   pergolando-frontend/     (git clone of the frontend repo)
#
# Verified end-to-end on the real NAS deploy (2026-09-20): register -> login
# -> wizard loading the real bundle catalog, through the public Cloudflare
# Tunnel domain.

services:
  backend:
    build:
      context: ./pergolando-backend
    env_file: ./backend.env
    volumes:
      - ./bundle:/app/bundle:ro
      - backend_data:/app/data
    # Calls the prisma binary directly, not via `pnpm exec` — the latter
    # re-runs pnpm's dependency status check on every container start,
    # which re-triggers the git-dependency build-script approval gate
    # (pnpm-lock.yaml/pnpm-workspace.yaml aren't in the runtime image) and
    # crash-loops the container. No need for pnpm at all here: node_modules
    # is already fully installed from the build stage.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    restart: unless-stopped

  frontend:
    build:
      context: ./pergolando-frontend
      args:
        # Separate subdomain, same tunnel (see README.md step 4) — the
        # browser calls this directly; CORS_ORIGIN on the backend and
        # credentials:"include" on the frontend already handle it, same as
        # in local dev (there it's different ports instead of subdomains).
        #
        # Single-level subdomain (pergolando-api, not api.pergolando):
        # Cloudflare's Universal SSL certificate only covers one subdomain
        # level (*.rdsign-app.it) — a two-level hostname like
        # api.pergolando.rdsign-app.it has no valid certificate and fails
        # TLS (ERR_SSL_VERSION_OR_CIPHER_MISMATCH) unless Advanced
        # Certificate Manager is purchased. Confirmed on the actual NAS
        # deploy — this cost real debugging time, don't reintroduce it.
        NEXT_PUBLIC_API_URL: "https://pergolando-api.rdsign-app.it"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      # From the Cloudflare dashboard: Networking > Tunnels > your tunnel >
      # Configure > Docker. Put it in a .env file next to this compose file
      # (TUNNEL_TOKEN=...), never commit it.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:
